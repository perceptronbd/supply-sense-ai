services:
  # MCP Server (AI Agent)
  mcp-server:
    build:
      context: .
      dockerfile: ./mastra-mcp-server/Dockerfile
    container_name: supply-chain-mcp-server
    restart: unless-stopped
    env_file:
      - ./mastra-mcp-server/.env
    environment:
      NODE_ENV: production
      MCP_PORT: 3005
      MCP_HOST: 0.0.0.0
    ports:
      - '3005:3005'
    networks:
      - supply-chain-network
    # Proper stop configuration
    stop_signal: SIGTERM
    stop_grace_period: 30s
    # Resource limits for Nanode (more memory available without local DB)
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

  # Backend API
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: supply-chain-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 3004
      MCP_SERVER_URL: http://mcp-server:3005
    ports:
      - '3004:3004'
    depends_on:
      - mcp-server
    networks:
      - supply-chain-network
    # Proper stop configuration
    stop_signal: SIGTERM
    stop_grace_period: 30s
    # Resource limits for Nanode (more memory available without local DB)
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: supply-chain-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env.local
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'
    depends_on:
      - backend
    networks:
      - supply-chain-network
    # Proper stop configuration
    stop_signal: SIGTERM
    stop_grace_period: 30s
    # Resource limits for Nanode (more memory available without local DB)
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 192M

networks:
  supply-chain-network:
    driver: bridge
